ingress-nginx:
  enabled: true
  controller:
    extraArgs:
      enable-ssl-passthrough: true
    admissionWebhooks:
      enabled: false
    service:
      externalTrafficPolicy: Local
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
        service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
        service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "10254"
      external: 
        enabled: true
      internal:
        enabled: false
        # annotations:
        #   service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
cert-manager:
  enabled: true
  crds:
    enabled: true
    keep: false
  # AKS Admissions Enforcer adds namespaceSelector items to this webhook -> Argo OutOfSync forever; opt out.
  # https://github.com/nethopper2/notes/blob/main/infra-236-duckdb-missing-and-ingress-warden-sync/03-ingress-warden-out-of-sync.md
  webhook:
    validatingWebhookConfigurationAnnotations:
      admissions.enforcer/disabled: "true"
