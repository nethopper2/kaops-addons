{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "private-ai.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "private-ai.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and .Values.ingress.oauth2Proxy.enabled .Values.ingress.oauth2Proxy.authUrl .Values.ingress.oauth2Proxy.authSignin }}
    nginx.ingress.kubernetes.io/auth-url: {{ .Values.ingress.oauth2Proxy.authUrl | quote }}
    nginx.ingress.kubernetes.io/auth-signin: {{ .Values.ingress.oauth2Proxy.authSignin | quote }}
    nginx.ingress.kubernetes.io/auth-response-headers: {{ .Values.ingress.oauth2Proxy.authResponseHeaders | quote }}
    {{- end }}
    {{- if .Values.ingress.ignoreSSL }}
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    {{- end }}
    {{- /* Only proxy-buffer-size: the other three annotations this flag rendered were invalid
           ("4256k"/"432k" typos; large-client-header-buffers has no annotation form) and
           proxy-busy-buffers-size 256k > the real buffer pool made `nginx -t` fail, freezing
           the controller on ingress-nginx 1.15 (notes infra-190 05, 2026-09-11). */}}
    {{- if .Values.ingress.increaseBuffersSize }}
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    {{- end }}
    {{- /* Upload limit (nginx default 1m). A plain value, not an annotation, so it survives KAOPS's
           dotted-key expansion (notes kaops-dotted-annotation-keys-break-charts). */}}
    {{- with .Values.ingress.proxyBodySize }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ . | quote }}
    {{- end }}
spec:
  {{- with .Values.ingress.class }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
      - {{ .Values.ingress.host | quote }}
      {{- range .Values.ingress.additionalHosts }}
      - {{ . | quote }}
      {{- end }}
      secretName: {{ default (printf "%s-tls" .Release.Name) .Values.ingress.existingSecret }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: open-webui
            port:
              name: http
  {{- range .Values.ingress.additionalHosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: open-webui
            port:
              name: http
  {{- end }}
---
{{/* Second Ingress for paths that bypass oauth2-proxy authentication */}}
{{- if and .Values.ingress.oauth2Proxy.enabled .Values.ingress.oauth2Proxy.skipAuthPaths }}
{{- range $skipPath := .Values.ingress.oauth2Proxy.skipAuthPaths }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "private-ai.name" $ }}-no-auth-{{ . | trimPrefix "/" | replace "/" "-" | replace "_" "-" | trimPrefix "-" | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "private-ai.labels" $ | nindent 4 }}
  annotations:
    {{- with $.Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $.Values.ingress.ignoreSSL }}
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    {{- end }}
    {{- if $.Values.ingress.increaseBuffersSize }}
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    {{- end }}
    {{- with $.Values.ingress.proxyBodySize }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ . | quote }}
    {{- end }}
spec:
  {{- with $.Values.ingress.class }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $.Values.ingress.tls }}
  tls:
    - hosts:
      - {{ $.Values.ingress.host | quote }}
      {{- range $.Values.ingress.additionalHosts }}
      - {{ . | quote }}
      {{- end }}
      secretName: {{ default (printf "%s-tls" $.Release.Name) $.Values.ingress.existingSecret }}
  {{- end }}
  rules:
  - host: {{ $.Values.ingress.host }}
    http:
      paths:
      - path: {{ $skipPath }}
        pathType: Prefix
        backend:
          service:
            name: open-webui
            port:
              name: http
  {{- range $.Values.ingress.additionalHosts }}
  - host: {{ . | quote }}
    http:
      paths:
      - path: {{ $skipPath }}
        pathType: Prefix
        backend:
          service:
            name: open-webui
            port:
              name: http
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
