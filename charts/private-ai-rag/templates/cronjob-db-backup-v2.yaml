{{/*
  cronjob-db-backup-v2.yaml — replacement for cronjob-db-backup.yaml.

  Turned on by backups.v2.enabled, which is separate from v1's backups.enabled — so
  both can run at once while you compare them. v1 writes to <bucket>/postgres/,
  v2 to <bucket>/postgres-v2/. Both on = two full dumps per schedule, so switch v1
  off once you trust v2. To switch v1 off, delete its template: setting
  backups.enabled=false only removes the CronJob if ArgoCD pruning is on, otherwise
  it stays in the cluster and keeps running.

  What changed vs v1, and why:

  1. Staged in two containers instead of one script.
     - initContainer `dump`   : postgres:17-alpine  (has pg_dumpall, gzip, grep)
     - container     `upload` : rclone/rclone       (~tens of MiB, speaks GCS + S3)
     initContainers run to completion before regular containers start, so the
     upload can only run if dump+verify exited 0. No marker files, no `&& \`
     chains, no `set -o pipefail` (which dash does not support anyway).

  2. No tooling installed at runtime. v1 ran `apk add aws-cli` / `apt-get install
     postgresql-client-17` from apt.postgresql.org on EVERY execution, putting an
     external repo in the critical path of backups. Both images ship what they need.

  3. One code path for every cloud. rclone speaks GCS (service-account JSON), S3
     (IRSA or keys) and Azure Blob (account key or managed identity) natively, so
     backups.type only selects env vars, not a second copy of the whole script.
     Fixes therefore only need writing once.

  4. Integrity is verified BEFORE upload. pg_dumpall's final line is
     `-- PostgreSQL database cluster dump complete`; without it the dump is
     truncated. v1 could not detect this: in a pipeline the shell reports only the
     LAST command's status, so a pg_dumpall that died partway still let
     gzip+upload succeed and the job exited 0 reporting success.

  5. concurrencyPolicy: Forbid — v1 defaulted to Allow, so a dump slower than the
     schedule would overlap with itself.
*/}}
{{/* nil-safe: `.Values.backups.v2.enabled` would error with "nil pointer evaluating
     interface {}.enabled" if the v2 key is absent from values.yaml. Reading a missing
     key off an existing map yields nil harmlessly; it is dereferencing that nil which
     fails. So coerce to a dict first, then gate. */}}
{{- $b := .Values.backups | default dict }}
{{- $v2 := $b.v2 | default dict }}
{{/*
  Normalise the destination type ONCE. Every branch below compares against $type, not
  $b.type, because the old code tested `ne $b.type "s3"` to mean "this is GCS" — which
  silently became wrong the moment a third backend existed, sending azureblob down the
  GCS credential path. An explicit default also preserves the historical behaviour that
  an unset backups.type means GCS.
*/}}
{{- $type := $b.type | default "gcs" }}
{{- if not (has $type (list "gcs" "s3" "azureblob")) }}
{{- fail (printf "backups.type must be one of gcs, s3, azureblob — got %q" $type) }}
{{- end }}
{{/*
  Value resolution: `backups.*` is the shared base (type, buckets, region, credential
  refs, serviceAccountName — these MUST match v1 or you are backing up something else).
  `backups.v2.*` overrides only what should differ per job version.

  `$v2.x | default $b.x` is safe for strings and maps, but NOT for booleans or numbers:
  `default` treats false/0/"" as empty, so `false | default true` yields TRUE. For the
  same reason do not reach for sprig `merge` here — it uses mergo, which overwrites
  zero-valued keys from the source. `enabled` is therefore read from $v2 only, never
  defaulted. Same care needed for any future boolean.
*/}}
{{- if $v2.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "private-ai.fullname" . }}-pg-backup-v2
  labels:
    {{- include "private-ai.labels" . | nindent 4 }}
spec:
  # `enabled` controls whether the object exists at all; `suspend` keeps an existing
  # CronJob from firing on schedule while still allowing manual runs via
  #   kubectl create job --from=cronjob/<name>
  # Safe to use `default` on this boolean only because the fallback IS the zero value.
  suspend: {{ $v2.suspend | default false }}
  schedule: {{ $v2.schedule | default $b.schedule | quote }}
  {{- with $v2.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  # v1 defaults to Allow, so a dump slower than the schedule overlaps with itself
  concurrencyPolicy: {{ $v2.concurrencyPolicy | default "Forbid" }}
  # Required alongside Forbid: a schedule that cannot start is counted as "missed", and
  # after 100 missed schedules the CronJob controller STOPS SCHEDULING ALTOGETHER and
  # only logs about it. This bounds how far back it will try to catch up.
  startingDeadlineSeconds: {{ $v2.startingDeadlineSeconds | default 3600 }}
  successfulJobsHistoryLimit: {{ $v2.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $v2.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      # Each retry is a COMPLETE re-dump, so keep this low.
      backoffLimit: {{ $v2.backoffLimit | default 2 }}
      # A pod that has Succeeded/Failed reserves no CPU/memory/ephemeral-storage, but its
      # emptyDir CONTENTS stay on the node until the pod object is deleted. Retained
      # history therefore holds real bytes (~89 MiB per dump), not the sizeLimit. TTL
      # deletes the Job and its pods so that space is reclaimed; it also caps how long
      # logs stay available, so trade it off against the history limits below.
      ttlSecondsAfterFinished: {{ $v2.ttlSecondsAfterFinished | default 86400 }}
      # bound a runaway dump; mphr's takes hours, so keep this generous
      activeDeadlineSeconds: {{ $v2.activeDeadlineSeconds | default 21600 }}
      template:
        {{/*
          Pod labels. Two sources, and the user's always wins.

          The azureblob + identity path REQUIRES azure.workload.identity/use="true":
          that label is the sole trigger for the AKS mutating webhook, and without it
          the pod gets no projected token and no AZURE_* env, so rclone's env_auth
          finds nothing. The failure lands AFTER a successful dump, which reads like a
          working backup that silently stores nothing — bad enough to be worth adding
          automatically rather than documenting.

          Added only when it is actually needed (azureblob AND no key secret), and only
          when the user has not set the key themselves — hasKey, so an explicit
          "false" is respected. No sprig `merge` here, for the reason given at the top
          of this file: mergo's zero-value handling makes it a poor fit for anything
          you actually care about.

          The label is inert on EKS/GKE — no webhook there watches for it — so nothing
          guards it by cloud.
        */}}
        {{- $podLabels := $v2.podLabels | default dict }}
        {{- $wantWiLabel := and (eq $type "azureblob") (not $b.azureStorageKeySecretRef) (not (hasKey $podLabels "azure.workload.identity/use")) }}
        {{- if or $podLabels $wantWiLabel $v2.podAnnotations }}
        metadata:
          {{- if or $podLabels $wantWiLabel }}
          labels:
            {{- if $wantWiLabel }}
            azure.workload.identity/use: "true"
            {{- end }}
            {{- with $podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with $v2.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        spec:
          restartPolicy: OnFailure
          {{- if and (has $type (list "s3" "azureblob")) $b.serviceAccountName }}
          {{/* s3 -> IRSA; azureblob -> workload identity. Both need the SA that
               carries the federated-credential annotation. */}}
          serviceAccountName: {{ $b.serviceAccountName }}
          {{- end }}
          volumes:
            - name: work
              emptyDir:
                # Only the COMPRESSED dump is staged; verification decompresses through
                # a pipe and never writes it out. champagne/prod is ~89 MiB gzipped.
                # Check yours before lowering this:
                #   gsutil ls -l 'gs://<bucket>/postgres/**/all_dbs.sql.gz' | sort -k2 | tail -5
                sizeLimit: {{ $v2.workDirSize | default "4Gi" }}

          initContainers:
            # ---------- stage 1: dump + verify -------------------------------
            - name: dump
              image: {{ $v2.dumpImage | default "postgres:17-alpine" }}
              imagePullPolicy: {{ $v2.imagePullPolicy | default "IfNotPresent" }}
              env:
                - name: PGHOST
                  value: {{ .Values.rag.postgresHost }}
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: {{ .Values.global.postgresql.auth.username }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.global.postgresql.auth.existingSecret }}
                      key: {{ .Values.global.postgresql.auth.secretKeys.adminPasswordKey }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  date +%Y%m%d_%H%M%S > /work/TS
                  echo "Dumping all databases…"
                  pg_dumpall --host="$PGHOST" --port="$PGPORT" --username="$PGUSER" \
                    | gzip > /work/all_dbs.sql.gz
                  # pg_dumpall's trailer is the only reliable proof the dump ran to
                  # completion. Absent => truncated => fail before anything is stored.
                  echo "Verifying dump integrity…"
                  if ! gzip -dc /work/all_dbs.sql.gz | tail -5 \
                       | grep -q 'PostgreSQL database cluster dump complete'; then
                    echo "FATAL: no pg_dumpall trailer - dump is truncated, aborting."
                    exit 1
                  fi
                  echo "OK: $(wc -c < /work/all_dbs.sql.gz) bytes, trailer present."
                  # Report our own peak RSS. Once this pod exits the cgroup is destroyed and
                  # the peak is UNRECOVERABLE - no Kubernetes or node API retains it, and a
                  # 30s Prometheus scrape badly undersamples a ~60s container (it reported
                  # 2.5 MiB for a stage measured at 104.8 MiB). Logging it here makes the
                  # number permanent, survives pod deletion, and needs no external polling.
                  echo "PEAK_MEM_BYTES=$(cat /sys/fs/cgroup/memory.peak 2>/dev/null \
                    || cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes 2>/dev/null \
                    || echo unknown)"
                  echo "WORKDIR_BYTES=$(du -sb /work 2>/dev/null | awk '{print $1}')"
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                {{- if $v2.dumpResources }}
                {{- toYaml $v2.dumpResources | nindent 16 }}
                {{- else }}
                # Without an ephemeral-storage request the scheduler does not know this
                # pod needs staging space and can place it on a node with none; the dump
                # then breaches the emptyDir sizeLimit and kubelet evicts it mid-run.
                # NOTE: setting dumpResources REPLACES this - include ephemeral-storage.
                requests:
                  ephemeral-storage: {{ $v2.workDirSize | default "4Gi" }}
                {{- end }}

          containers:
            # ---------- stage 2: upload --------------------------------------
            - name: upload
              image: {{ $v2.rcloneImage | default "rclone/rclone:v1.74-stable" }}
              # Pinned to a minor series, not ":latest". ":latest" would (a) let a future
              # rclone change behaviour under a backup job with nobody deciding to
              # upgrade, and (b) force imagePullPolicy=Always, putting a registry
              # round-trip in the backup path every run - v1's per-run apt-get defect.
              # `vX.Y-stable` is still MUTABLE (it moves with 1.74.x patches), which is
              # usually what you want for security fixes, but combined with
              # IfNotPresent it means nodes can hold different patch versions. Use a
              # digest (rclone/rclone@sha256:...) if you need strict reproducibility.
              # List tags with: crane ls rclone/rclone | grep stable
              imagePullPolicy: {{ $v2.imagePullPolicy | default "IfNotPresent" }}
              env:
                # rclone is configured purely from RCLONE_CONFIG_* env vars below; point
                # it at /dev/null so it does not look for (or try to create) a config
                # file under $HOME, which may not exist or be writable in this image.
                - name: RCLONE_CONFIG
                  value: /dev/null
                - name: BACKUP_BUCKET
                  {{- if eq $type "s3" }}
                  value: {{ $b.s3BucketName | quote }}
                  {{- else if eq $type "azureblob" }}
                  {{/* rclone's azureblob backend addresses a CONTAINER exactly where the
                       other backends address a bucket, so the DEST:<name>/<path> form in
                       the upload step needs no change. */}}
                  value: {{ $b.azureContainerName | quote }}
                  {{- else }}
                  value: {{ $b.gcsBucketName | quote }}
                  {{- end }}
                - name: BACKUP_PREFIX
                  value: {{ $v2.pathPrefix | default "postgres-v2" | quote }}
                {{- if eq $type "s3" }}
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: s3
                - name: RCLONE_CONFIG_DEST_PROVIDER
                  value: AWS
                - name: RCLONE_CONFIG_DEST_REGION
                  value: {{ $b.s3Region | quote }}
                {{- if $b.serviceAccountName }}
                # IRSA: let rclone pick up the projected web-identity token
                - name: RCLONE_CONFIG_DEST_ENV_AUTH
                  value: "true"
                {{- else }}
                - name: RCLONE_CONFIG_DEST_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ $b.s3AccessKeySecretRef }}
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_DEST_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $b.s3AccessKeySecretRef }}
                      key: AWS_SECRET_ACCESS_KEY
                {{- end }}
                {{- else if eq $type "azureblob" }}
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: azureblob
                - name: RCLONE_CONFIG_DEST_ACCOUNT
                  value: {{ required "backups.azureStorageAccount is required when backups.type=azureblob" $b.azureStorageAccount | quote }}
                {{- if $b.azureStorageKeySecretRef }}
                {{/* Shared-key auth. The key is the STORAGE ACCOUNT KEY, not a
                     connection string — rclone parses neither, it wants account and key
                     as separate values. Terraform's azure-storage module already exposes
                     it as the `primary_access_key` output. */}}
                - name: RCLONE_CONFIG_DEST_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $b.azureStorageKeySecretRef }}
                      key: {{ $b.azureStorageKeySecretKey | default "AZURE_STORAGE_KEY" }}
                {{- else }}
                {{/* No key given: fall back to Entra. env_auth lets rclone use the
                     AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_FEDERATED_TOKEN_FILE that
                     the AKS workload-identity webhook injects, which needs
                     backups.serviceAccountName to point at an annotated ServiceAccount.
                     Prefer this over a key once federation is set up — it is the direct
                     analogue of the s3 branch's IRSA path. */}}
                - name: RCLONE_CONFIG_DEST_ENV_AUTH
                  value: "true"
                {{- with $b.azureClientId }}
                - name: AZURE_CLIENT_ID
                  value: {{ . | quote }}
                {{- end }}
                {{- end }}
                {{- else }}
                - name: RCLONE_CONFIG_DEST_TYPE
                  value: google cloud storage
                # REQUIRED for buckets with Uniform bucket-level access (UBLA), which is
                # the default for new GCS buckets. rclone otherwise sets a predefined
                # per-object ACL on upload and UBLA rejects it:
                #   googleapi: Error 400: Cannot insert legacy ACL for an object when
                #   uniform bucket-level access is enabled
                # gsutil (v1) does not set object ACLs, which is why v1 never hit this.
                # Harmless on non-UBLA buckets: objects just inherit bucket defaults.
                - name: RCLONE_CONFIG_DEST_BUCKET_POLICY_ONLY
                  value: "true"
                # The SA key is passed to rclone as JSON *content*, not a file path, so
                # no credentials volume and no separate "materialise the key" stage are
                # needed. Decoded inline below; never written to disk.
                - name: GOOGLE_APPLICATION_CREDENTIALS_BASE64
                  valueFrom:
                    secretKeyRef:
                      name: {{ $b.googleApplicationCredentialsSecretRef | default .Values.global.googleApplicationCredentialsSecretRef }}
                      key: GOOGLE_APPLICATION_CREDENTIALS_BASE64
                {{- end }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  {{- if eq $type "gcs" }}
                  # busybox base64 is present in the rclone (alpine) image
                  RCLONE_CONFIG_DEST_SERVICE_ACCOUNT_CREDENTIALS=$(
                    printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_BASE64" | base64 -d
                  )
                  export RCLONE_CONFIG_DEST_SERVICE_ACCOUNT_CREDENTIALS
                  unset GOOGLE_APPLICATION_CREDENTIALS_BASE64
                  # v1 swallowed a decode failure with `|| echo "Continue..."`, which only
                  # deferred it to a confusing gcloud auth error several steps later.
                  if [ -z "$RCLONE_CONFIG_DEST_SERVICE_ACCOUNT_CREDENTIALS" ]; then
                    echo "FATAL: decoded GCP credentials are empty."
                    exit 1
                  fi
                  {{- end }}
                  TS=$(cat /work/TS)
                  DEST="DEST:${BACKUP_BUCKET}/${BACKUP_PREFIX}/${TS}/all_dbs.sql.gz"
                  echo "Uploading $(wc -c < /work/all_dbs.sql.gz) bytes -> ${DEST}"
                  rclone copyto --checksum /work/all_dbs.sql.gz "$DEST"
                  echo "Upload complete: ${DEST}"
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
              resources:
                {{- toYaml ($v2.uploadResources | default dict) | nindent 16 }}
{{- end }}
