apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-configmap-rag
  labels:
    {{- include "private-ai.labels" . | nindent 4 }}
data:
  POSTGRES_HOST: {{ .Values.rag.postgresHost }}
  POSTGRES_USERNAME: {{ .Values.global.postgresql.auth.username }}
  GCS_BUCKET_NAME: {{ .Values.rag.gcsBucketName }}
  ALLOWED_CORS_ORIGIN: {{ include "private-ai.corsOrigins" . }}
  NH_DATA_SERVICE_URL: {{ .Values.rag.dataServiceUrl }}
  NH_DATA_SERVICE_URL_BACKEND: {{ .Values.rag.dataServiceUrlBackend | default .Values.rag.dataServiceUrl }}
  NH_RAG_API_URL: {{ .Values.rag.ragApiUrl }}
  GOOGLE_API_SCOPES: {{ .Values.rag.googleApiScopes }}
  NH_WEBUI_CUSTOM: {{ .Values.rag.custom | toJson | quote }}
  ALLOWED_EXTENSIONS: {{ .Values.rag.allowedExtensions }}
  DOCKER_IMAGE: {{ include "private-ai.image" . }}
  {{- if .Values.rag.googleAllowedExtensions }}
  GOOGLE_ALLOWED_EXTENSIONS: {{ .Values.rag.googleAllowedExtensions }}
  {{- end }}
  {{- if eq .Values.ingress.oauth2Proxy.enabled true }}
  ENABLE_SIGNUP: 'true'
  WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-Forwarded-Email
  WEBUI_AUTH_TRUSTED_NAME_HEADER: X-Forwarded-User
  ENABLE_OAUTH_SIGNUP: 'true'
  WEBUI_SESSION_COOKIE_SAME_SITE: lax
  WEBUI_AUTH_COOKIE_SAME_SITE: lax
  ENABLE_LOGIN_FORM: 'true'
  SSO_PROVIDER_NAME: {{ .Values.ingress.oauthProviderName | quote }}
  {{- end }}
  {{- if eq .Values.dataIngestion.enabled true }}
  ENABLE_SSO_DATA_SYNC: {{ .Values.dataIngestion.enabled | quote }}
  OVERIDE_WEB_SOCKET_URL: {{ .Values.dataIngestion.config.overideWebSocketUrl | quote }}
  DATASOURCES_URL: {{ .Values.dataIngestion.config.dataSourcesUrl | quote }}
  {{- /*
    OAuth callbacks: https://<public host>/api/v1/data/<provider>/callback, where the public host
    is taken from dataSourcesUrl (https://<public host>/workspace/data-sources). Provider list must
    match OAUTH_PROVIDERS in kaops-open-webui/backend/open_webui/routers/data.py.
    An explicit dataIngestion.config.<provider>RedirectUrl wins; set it to "" to disable that
    provider (a connector is shown only when its CLIENT_ID, CLIENT_SECRET and REDIRECT_URI are all set).
  */}}
  {{- $diCfg := .Values.dataIngestion.config }}
  {{- $publicBase := trimSuffix "/workspace/data-sources" ($diCfg.dataSourcesUrl | default "") }}
  {{- range list "slack" "google" "microsoft" "atlassian" "mineral" "netsuite" "github" "hubspot" "salesforce" "procore" "zoom" }}
  {{- $key := printf "%sRedirectUrl" . }}
  {{- $derived := ternary (printf "%s/api/v1/data/%s/callback" $publicBase .) "" (ne $publicBase "") }}
  {{ upper . }}_REDIRECT_URI: {{ ternary (get $diCfg $key) $derived (hasKey $diCfg $key) | default "" | quote }}
  {{- end }}
  NH_DATA_INGESTION_MS_URL: {{ .Values.dataIngestion.config.serviceUrl | quote }}
  {{- end }}
  LLM_BASE_URL: {{ .Values.global.llmBaseUrl | quote }}
  {{- if .Values.global.enableSSO }}
  WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-Auth-Request-Email
  WEBUI_AUTH_TRUSTED_NAME_HEADER: X-Auth-Request-User
  {{- end }}
  {{- if eq (index .Values "nh-mcp-server").enabled true }}
  NH_MCP_SERVER_URL: {{ (index .Values "nh-mcp-server").config.url | quote }}
  {{- end }}
  NODE_ENV: {{ .Values.global.nodeEnv }}
  JUICEFS_S3_ENDPOINT: {{ .Values.global.juiceFsUrl | quote }}
  JIRA_SELF_HOSTED: {{ .Values.global.jiraSelfHosted | default false | quote }}
  CONFLUENCE_SELF_HOSTED: {{ .Values.global.confluenceSelfHosted | default false | quote }}
  PUBLIC_OPENREPLAY_INGEST_URL: {{ .Values.global.openreplayIngestUrl | quote }}
  ENABLE_COMMUNITY_SHARING: {{ .Values.global.enableCommunitySharing | quote }}
  USER_PERMISSIONS_NOTES_ALLOW_PUBLIC_SHARING: {{ .Values.global.userPermissionsNotesAllowPublicSharing | quote }}
  ENABLE_CALENDAR: {{ .Values.global.enableCalendar | quote }}
  ENABLE_AUTOMATIONS: {{ .Values.global.enableAutomations | quote }}
  EMBEDDINGS_PROVIDER: {{ .Values.rag.embeddings.provider | quote }}
  EMBEDDINGS_DIMENSION: {{ .Values.rag.embeddings.dimension | quote }}
  EMBEDDING_AUTO_REEMBED_ON_CONFIG_CHANGE: {{ .Values.rag.embeddings.autoReembedOnConfigChange | quote }}
  BEDROCK_EMBEDDINGS_MODEL: {{ .Values.rag.embeddings.bedrock.model | quote }}
  BEDROCK_EMBEDDINGS_REGION: {{ .Values.rag.embeddings.bedrock.region | quote }}
  {{- with (index .Values "nh-rag-api").memory }}
  MEMORY_BACKEND: {{ .backend | quote }}
  MEMORY_INJECT_K: {{ .injectK | quote }}
  MEMORY_TOP_K: {{ .topK | quote }}
  MEMORY_QDRANT_COLLECTION: {{ .qdrantCollection | quote }}
  MEMORY_SUMMARY_TURN_THRESHOLD: {{ .summaryTurnThreshold | quote }}
  MEMORY_MAX_INPUT_CHARS: {{ .maxInputChars | quote }}
  MEMORY_MAX_RECORD_CHARS: {{ .maxRecordChars | quote }}
  MEMORY_MAX_RECORDS_PER_TURN: {{ .maxRecordsPerTurn | quote }}
  MEMORY_FORGET_THRESHOLD: {{ .forgetThreshold | quote }}
  MEMORY_FORGET_CAP: {{ .forgetCap | quote }}
  {{- if .extractionModelId }}
  MEMORY_EXTRACTION_MODEL_ID: {{ .extractionModelId | quote }}
  {{- end }}
  {{- end }}