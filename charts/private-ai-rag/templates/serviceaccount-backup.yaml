{{/*
  serviceaccount-backup.yaml — the ServiceAccount the backup CronJob runs as.

  WHY THE CHART OWNS THIS, NOT TERRAFORM
  The obvious alternative is a `kubernetes_service_account` in the infra layer, since
  Terraform is where the cloud identity is created. It was rejected: the release
  namespace is created by Argo (CreateNamespace=true), so a Terraform-owned object
  inside it introduces a cross-system ordering dependency — on a fresh cluster
  `terraform apply` fails until Argo has synced once. Owning it here keeps every
  Kubernetes object under one manager, and costs nothing, because the only thing
  Terraform actually needs to hand over is an ANNOTATION VALUE.

  THE ANNOTATION VALUE IS NOT A SECRET
  For Azure it is the managed identity's client ID; for AWS an IAM role ARN. Both are
  identifiers, not credentials: possessing one grants nothing, because the token
  exchange also requires a JWT signed by the cluster whose issuer is registered in the
  identity's federated credential, with an exactly matching subject. So these belong in
  a values file in git, not in a sealed secret.

  DELIBERATELY CLOUD-AGNOSTIC
  Set the binding through the flat fields (azureWorkloadIdentityClientId, awsRoleArn,
  gcpServiceAccount): a dotted key in KAOPS-stored config gets split into nested maps.
  `serviceAccount.annotations` stays as a free-form escape hatch (flattened back),
  and the template emits:
      Azure   azure.workload.identity/client-id: <client id>
      AWS     eks.amazonaws.com/role-arn: arn:aws:iam::...:role/...
      GCP     iam.gke.io/gcp-service-account: ...@....iam.gserviceaccount.com
  The cronjob template still needs one Azure-specific POD LABEL, which it adds itself —
  see the podLabels handling there.

  ORDERING
  The federated identity credential on the cloud side must name this exact
  namespace/service-account pair before the first run, or the token exchange is
  rejected with a subject mismatch. On Azure that is Terraform's
  `storage_workload_identities`. Creating the SA does not create the trust.
*/}}
{{- $b := .Values.backups | default dict }}
{{- $sa := $b.serviceAccount | default dict }}
{{- if $sa.create }}
{{- if not $b.serviceAccountName }}
{{- fail "backups.serviceAccount.create is true but backups.serviceAccountName is not set — the CronJob and the ServiceAccount must agree on one name, and the cloud-side federated credential must name it too" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $b.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "private-ai.labels" . | nindent 4 }}
  {{- /*
    KAOPS splits any values key containing a dot into nested maps, so a stored
    `annotations: {azure.workload.identity/client-id: x}` reaches the chart as
    {azure: {workload: {identity/client-id: x}}}. Annotations are map[string]string,
    so a nested map is never legitimate: flatten it back (lossless). The flat fields
    below are the way to set the cloud binding through KAOPS; set last, they win.
    INFRA-176, https://github.com/nethopper2/notes/blob/main/infra-176-postgres-backups-azure/README.md
  */}}
  {{- $ann := dict }}
  {{- include "private-ai.flattenInto" (dict "m" ($sa.annotations | default dict) "prefix" "" "out" $ann) }}
  {{- with $sa.azureWorkloadIdentityClientId }}
  {{- $_ := set $ann "azure.workload.identity/client-id" (toString .) }}
  {{- end }}
  {{- with $sa.awsRoleArn }}
  {{- $_ := set $ann "eks.amazonaws.com/role-arn" (toString .) }}
  {{- end }}
  {{- with $sa.gcpServiceAccount }}
  {{- $_ := set $ann "iam.gke.io/gcp-service-account" (toString .) }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
  No automountServiceAccountToken override: the workload-identity webhook mounts its
  own PROJECTED token (short-lived, audience-scoped), which is a separate mechanism
  from the legacy API token this setting governs. Disabling that here would not improve
  anything and would break any future need to talk to the API server.
*/}}
{{- end }}
