# prometheus addon — the "new Prometheus". Design and reasoning:
# notes/infra-219-send-metrics-from-our-envs-to-grafana-cloud/04-new-prometheus-design.md
#
# Plain Helm values for the kube-prometheus-stack subchart. KAOPS fills in only the cluster name
# (config.yaml "system"); everything else is here.

# Create the namespace from this chart (true under KAOPS/Argo). false for a manual `helm install`
# into a namespace that already exists (Helm refuses to take over objects it didn't create).
createNamespace: true

kube-prometheus-stack:
  namespaceOverride: prometheus

  # Same object names on every cluster: prometheus-operator, Prometheus "prometheus", pod
  # prometheus-prometheus-0. Without these, names derive from the Helm release, which KAOPS
  # sets to "<cluster>-prometheus" (Argo app name), truncated to 26 chars
  # (ai-nh-stage-prometheus-kub-operator).
  fullnameOverride: prometheus
  cleanPrometheusOperatorObjectNames: true

  # What we keep, and what we send to Grafana Cloud: one map, metric name -> mode. Turned into regexes
  # by the chart (these strings go through Helm's tpl, see scrapeClasses / remoteWrite below).
  #   send        kept in this Prometheus, sent to Grafana Cloud (what we pay for)
  #   send-ours   kept for every namespace, sent only for series NOT in providerNamespaces
  #   keep        kept here only, not sent (local debugging, KEDA; 1 day, no PV — see retention below)
  #   keep-ours   kept here only, and only for series NOT in providerNamespaces
  #   drop        neither (switches a default off per cluster)
  # Verbs, like the relabel actions they become (keep / drop). Anything else (a typo) = drop.
  # A map, not a list: KAOPS merges maps key by key but replaces lists whole, so a cluster adds or drops
  # one metric with a one-line override (e.g. metrics.pg_stat_database_blks_hit: send) and still gets
  # later chart defaults. Descriptions + tiers: notes/infra-219-send-metrics-from-our-envs-to-grafana-cloud/
  # 07-metrics-reference.md. Default: tier 1 (+ node_uname_info, kube_namespace_created for dashboard
  # drop-downs) + container_memory_rss + the app / node metrics added in 0.1.3 (below); container usage
  # only for our namespaces (option A, 2026-10-09).
  metrics:
    # pod / workload state (kube-state-metrics; `namespace` = the object's): also for provider namespaces —
    # a broken CNI, CoreDNS or CSI pod breaks our apps too, and the alerts need these
    up: send
    kube_pod_info: send
    kube_pod_owner: send
    kube_pod_status_phase: send
    kube_pod_status_ready: send
    kube_pod_container_status_restarts_total: send
    kube_pod_container_status_waiting_reason: send
    kube_pod_container_status_last_terminated_reason: send
    kube_pod_container_status_last_terminated_exitcode: send
    kube_pod_container_resource_requests: send
    kube_pod_container_resource_limits: send
    kube_deployment_spec_replicas: send
    kube_deployment_status_replicas_available: send
    kube_statefulset_replicas: send
    kube_statefulset_status_replicas_ready: send
    kube_daemonset_status_desired_number_scheduled: send
    kube_daemonset_status_number_ready: send
    kube_job_status_failed: send
    kube_node_info: send
    kube_node_status_condition: send
    kube_node_status_allocatable: send
    kube_node_spec_unschedulable: send
    kube_persistentvolumeclaim_status_phase: send
    kube_persistentvolumeclaim_info: send
    kube_namespace_status_phase: send
    kube_namespace_created: send
    # container usage (cAdvisor): we can't resize the cloud provider's pods, so not sent for them
    container_cpu_usage_seconds_total: send-ours
    container_cpu_cfs_periods_total: send-ours
    container_cpu_cfs_throttled_periods_total: send-ours
    container_memory_working_set_bytes: send-ours
    container_memory_rss: send-ours
    container_network_receive_bytes_total: send-ours
    container_network_transmit_bytes_total: send-ours
    # nodes and volumes (node-exporter, kubelet). node-exporter series carry the namespace of the
    # exporter pod (KAOPS's, in `default`), not of a workload — never in providerNamespaces
    kubelet_volume_stats_available_bytes: send
    kubelet_volume_stats_capacity_bytes: send
    kubelet_volume_stats_used_bytes: send
    kubelet_volume_stats_inodes: send
    kubelet_volume_stats_inodes_used: send
    node_cpu_seconds_total: send
    node_memory_MemAvailable_bytes: send
    node_memory_MemTotal_bytes: send
    node_filesystem_avail_bytes: send
    node_filesystem_size_bytes: send
    node_filesystem_files: send
    node_filesystem_files_free: send
    node_load1: send
    node_load5: send
    node_load15: send
    node_disk_read_bytes_total: send
    node_disk_written_bytes_total: send
    node_network_receive_bytes_total: send
    node_network_transmit_bytes_total: send
    node_network_receive_errs_total: send
    node_network_transmit_errs_total: send
    node_nf_conntrack_entries: send
    node_nf_conntrack_entries_limit: send
    node_filefd_allocated: send
    node_filefd_maximum: send
    node_boot_time_seconds: send
    node_uname_info: send
    machine_cpu_cores: send
    machine_memory_bytes: send
    # --- added 2026-10-09 (0.1.3): a few cheap, high-value series per cluster ---
    # OOM kills inside a running container (a Celery prefork child, a Chromium tab): the container
    # doesn't restart, so the restart / last-terminated metrics never see them. ~1 series per container.
    container_oom_events_total: send-ours
    node_vmstat_oom_kill: send                       # all OOM kills on the node, system processes too
    # pressure stall: share of time work waited for CPU / memory / I/O (saturation before 100 %)
    node_pressure_cpu_waiting_seconds_total: send
    node_pressure_memory_waiting_seconds_total: send
    node_pressure_io_waiting_seconds_total: send
    node_timex_sync_status: send                     # clock drift breaks TLS / tokens / JWTs
    node_timex_offset_seconds: send
    # CronJobs: "last success too long ago" (backups), also when they silently stop running
    kube_cronjob_status_last_successful_time: send
    kube_cronjob_status_last_schedule_time: send
    kube_cronjob_next_schedule_time: send
    kube_cronjob_spec_suspend: send
    # redis-exporter (core-stack redis-ha)
    redis_up: send
    redis_memory_used_bytes: send
    redis_memory_max_bytes: send
    redis_db_keys: send
    redis_connected_clients: send
    redis_evicted_keys_total: send
    redis_rejected_connections_total: send
    # qdrant (REST API per endpoint, collection size)
    rest_responses_total: send
    rest_responses_fail_total: send
    rest_responses_avg_duration_seconds: send
    rest_responses_max_duration_seconds: send
    collections_vector_total: send
    # JuiceFS gateway: block-cache hit ratio, object-storage errors, filesystem usage, buffer
    juicefs_blockcache_hits: send
    juicefs_blockcache_miss: send
    juicefs_object_request_errors: send
    juicefs_used_space: send
    juicefs_used_inodes: send
    juicefs_used_buffer_size_bytes: send
    # postgres-exporter (Bitnami `postgresql.metrics`)
    pg_up: send
    pg_settings_max_connections: send
    pg_stat_database_numbackends: send
    pg_stat_database_blks_hit: send
    pg_stat_database_blks_read: send
    pg_stat_database_deadlocks: send
    pg_database_size_bytes: send
    pg_stat_activity_max_tx_duration: send
    # cert-manager (ingress-warden `cert-manager.prometheus.servicemonitor`)
    certmanager_certificate_expiration_timestamp_seconds: send
    certmanager_certificate_ready_status: send
    # ingress-nginx (ingress-warden `ingress-nginx.controller.metrics`): request rate by status, latency avg
    nginx_ingress_controller_requests: send
    nginx_ingress_controller_request_duration_seconds_count: send
    nginx_ingress_controller_request_duration_seconds_sum: send

  # Namespaces run by the cloud provider (GKE / AKS / EKS add-ons): a regex, so new ones (gke-managed-*)
  # are covered without editing. Everything else — and series without a namespace label — counts as ours.
  providerNamespaces: "kube-.*|gmp-.*|gke-.*"

  # CRDs come from KAOPS's observability-edge release (operator v0.76.1). Never install ours.
  crds:
    enabled: false

  # Components of the chart we don't deploy: KAOPS's release already runs them (kube-state-metrics,
  # node-exporter, the kubelet / API server / control-plane ServiceMonitors), or we don't want them
  # here (alerting rules, Alertmanager, Grafana, Thanos Ruler, Windows exporter).
  defaultRules:
    create: false
  windowsMonitoring:
    enabled: false
  alertmanager:
    enabled: false
  grafana:
    enabled: false
  thanosRuler:
    enabled: false
  kubeStateMetrics:
    enabled: false        # scrape KAOPS's kube-state-metrics
  nodeExporter:
    enabled: false        # scrape KAOPS's node-exporter (:9101, hostNetwork)
  kubeApiServer:
    enabled: false
  kubelet:
    enabled: false        # KAOPS's kubelet ServiceMonitor + its kube-system kubelet Service
  kubeControllerManager:
    enabled: false
  coreDns:
    enabled: false
  kubeDns:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false

  prometheusOperator:
    # No cluster-wide admission webhooks (KAOPS's operator has its own) ⇒ no webhook TLS either.
    admissionWebhooks:
      enabled: false
    tls:
      enabled: false
    # KAOPS's operator already maintains kube-system/<cluster>-observability-e-kubelet.
    kubeletService:
      enabled: false
    serviceMonitor:
      selfMonitor: false
    # Only reconcile Prometheus / Alertmanager / ThanosRuler objects in our namespace.
    # KAOPS's operator runs with the same flags set to "default" (checked 2026-09-30, azure-dev2).
    # ServiceMonitors / PodMonitors are still read from all namespaces.
    prometheusInstanceNamespaces: [prometheus]
    alertmanagerInstanceNamespaces: [prometheus]
    alertmanagerConfigNamespaces: [prometheus]
    thanosRulerInstanceNamespaces: [prometheus]
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi

  prometheus:
    serviceMonitor:
      selfMonitor: false
    prometheusSpec:
      replicas: 1                     # HA (2 + anti-affinity + PDB) later
      scrapeInterval: 60s             # 1 sample/min per series = what Grafana Cloud bills
      evaluationInterval: 60s
      retention: 1d                   # long-term lives in Grafana Cloud
      retentionSize: 1GB
      storageSpec:                    # no PVs: emptyDir, capped
        emptyDir:
          sizeLimit: 2Gi
      resources:                      # measured 2026-10-08 (tier 1, ~3.6k series): RSS 165–186 MiB, CPU < 20m
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      # Sets GOMEMLIMIT to 90 % of the container's memory limit (a feature flag in Prometheus 2.x — ours is
      # v2.54.1 — on by default in 3.0): the Go GC works harder near the limit instead of letting the heap
      # overshoot. Doesn't help if the live data itself (head series, a WAL replay) needs more.
      enableFeatures:
        - auto-gomemlimit

      # Added to every series sent to Grafana Cloud: how clusters are told apart there.
      # cluster: set by KAOPS on install (config.yaml "system").
      externalLabels:
        cluster: ""
      # Grafana Cloud HA dedup expects cluster + __replica__; harmless with 1 replica, ready for 2.
      replicaExternalLabelName: __replica__
      prometheusExternalLabelNameClear: true

      # Every ServiceMonitor / PodMonitor in the cluster, whatever its labels. The chart's default
      # selector is release=<this release>; `matchLabels: null` removes it, leaving an empty selector
      # = select all. Safe because the default scrape class below (still named "allowlist") keeps only what
      # `metrics` lists anyway, and it doesn't depend on KAOPS's per-cluster release name
      # (<cluster>-observability-edge).
      serviceMonitorSelector:
        matchLabels: null
      serviceMonitorNamespaceSelector: {}
      podMonitorSelector:
        matchLabels: null
      podMonitorNamespaceSelector: {}

      # Applies to every monitor above (none names a class). Needs operator >= v0.75 (we have v0.76.1).
      scrapeClasses:
        - name: allowlist
          default: true
          # Target level: don't even fetch the API server (40–65% of today's series, control plane).
          relabelings:
            - sourceLabels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
              regex: default;kubernetes
              action: drop
          # Sample level: keep what `metrics` (top of this file) doesn't drop, then drop the keep-ours
          # ones from providerNamespaces.
          metricRelabelings:
            - sourceLabels: [__name__]
              regex: '{{- $l := list }}{{- range $k, $v := .Values.metrics }}{{- if has (toString $v) (list "send" "send-ours" "keep" "keep-ours") }}{{- $l = append $l $k }}{{- end }}{{- end }}{{- if $l }}{{ $l | sortAlpha | join "|" }}{{- else }}__none__{{- end }}'
              action: keep
            - sourceLabels: [__name__, namespace]
              regex: '({{- $l := list }}{{- range $k, $v := .Values.metrics }}{{- if has (toString $v) (list "keep-ours") }}{{- $l = append $l $k }}{{- end }}{{- end }}{{- if $l }}{{ $l | sortAlpha | join "|" }}{{- else }}__none__{{- end }});({{ .Values.providerNamespaces }})'
              action: drop

      # One Grafana Cloud stack for all clusters ⇒ same URL everywhere.
      # Secret grafana-cloud-metrics in namespace prometheus: username = Grafana Cloud Prometheus
      # instance ID, password = access policy token with metrics:write. Created by KAOPS (a KAOPS sealed
      # secret, see notes/infra-219-send-metrics-from-our-envs-to-grafana-cloud/05-prometheus-addon-mvp.md).
      remoteWrite:
        - url: https://prometheus-prod-56-prod-us-east-2.grafana.net/api/prom/push
          # Send only `send` / `send-ours` metrics, and the send-ours ones not from providerNamespaces.
          writeRelabelConfigs:
            - sourceLabels: [__name__]
              regex: '{{- $l := list }}{{- range $k, $v := .Values.metrics }}{{- if has (toString $v) (list "send" "send-ours") }}{{- $l = append $l $k }}{{- end }}{{- end }}{{- if $l }}{{ $l | sortAlpha | join "|" }}{{- else }}__none__{{- end }}'
              action: keep
            - sourceLabels: [__name__, namespace]
              regex: '({{- $l := list }}{{- range $k, $v := .Values.metrics }}{{- if has (toString $v) (list "send-ours") }}{{- $l = append $l $k }}{{- end }}{{- end }}{{- if $l }}{{ $l | sortAlpha | join "|" }}{{- else }}__none__{{- end }});({{ .Values.providerNamespaces }})'
              action: drop
          basicAuth:
            username:
              name: grafana-cloud-metrics
              key: username
            password:
              name: grafana-cloud-metrics
              key: password
