apiVersion: v2
name: prometheus
description: >-
  KAOPS addon: our own Prometheus ("new Prometheus") next to KAOPS's observability-edge one.
  Scrapes the same ServiceMonitors / PodMonitors, keeps only an allowlist of metrics (tier 1),
  remote-writes to Grafana Cloud. Notes: notes/infra-219-send-metrics-from-our-envs-to-grafana-cloud
type: application
version: 0.1.2
appVersion: "v0.76.1"

dependencies:
  # Same chart version as KAOPS's observability-edge (63.1.0 = prometheus-operator v0.76.1):
  # we don't install CRDs, we use the ones KAOPS's release installed. Bump only together with KAOPS's.
  - name: kube-prometheus-stack
    version: 63.1.0
    repository: https://prometheus-community.github.io/helm-charts
