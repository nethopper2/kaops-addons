metadata:
  slug: nh-intel
  name: NH Intel
  description: Deploy NH Intel RAG API and MCP Server.
  categories: [Artificial Intelligence]
  logoUrlDark: "https://nh-addons.s3.us-east-1.amazonaws.com/private-ai/logo-dark.png"
  logoUrlLight: "https://nh-addons.s3.us-east-1.amazonaws.com/private-ai/logo-light.png"
  detailUrl: "https://addons.kaops.net/nh-intel/"
  externalUrl: "https://nethopper.io"
  isProduction: true
  isStaging: true
  useSafeDelete: true
  serverSideDiff: true
  installTargets:
    clusterMessage: Must be installed on clusters configured for Ingress.

forms:
  - slug: default
    label: Configuration
    steps:
      - slug: details
        variableSlugs:
          - awsOpenAIKeySecretRef
          - azureOpenAIKeySecretRef
          - googleApplicationCredentialsSecretRef
        ui:
          label: Details

variables:
  - slug: awsOpenAIKeySecretRef
    path: "global.awsOpenAIKeySecretRef"
    forms: [default]
    ui:
      type: secret
      label: AWS OpenAI Key (Bedrock)
      help: Amazon Bedrock API key. Required when the AI provider is AWS Bedrock (default).
      validation: optional
  - slug: azureOpenAIKeySecretRef
    path: "global.azureOpenAIKeySecretRef"
    forms: [default]
    ui:
      type: secret
      label: Azure OpenAI API Key
      help: Secret carrying AZURE_OPENAI_API_KEY. Required when LLM_PROVIDER / EMBEDDINGS_PROVIDER is azure.
      validation: optional
  - slug: googleApplicationCredentialsSecretRef
    path: "global.googleApplicationCredentialsSecretRef"
    forms: [default]
    ui:
      type: secret
      label: Google Application Credentials (Vertex AI)
      help: Secret carrying base64 service-account JSON (GOOGLE_APPLICATION_CREDENTIALS_BASE64). Optional on GKE with workload identity.
      validation: optional

system:
  # External services from private-ai-rag
  - path: "rag.postgresHost"
    value: "${system.cluster.name}-private-ai-rag-postgresql.nh-addons.svc.cluster.local"
  # nh-rag-api (v1)
  - path: "nh-rag-api.env.QDRANT_URL"
    value: "http://${system.cluster.name}-private-ai-rag-qdrant.nh-addons.svc.cluster.local:6333"
  - path: "nh-rag-api.config.juiceFsUrl"
    value: "http://${system.cluster.name}-private-ai-rag-juicefs-s3-gateway.nh-addons.svc.cluster.local:9000"
  # nh-rag-api-v2
  - path: "nh-rag-api-v2.env.QDRANT_URL"
    value: "http://${system.cluster.name}-private-ai-rag-qdrant.nh-addons.svc.cluster.local:6333"
  - path: "nh-rag-api-v2.config.juiceFsUrl"
    value: "http://${system.cluster.name}-private-ai-rag-juicefs-s3-gateway.nh-addons.svc.cluster.local:9000"
  # shared
  - path: "global.juiceFsUrl"
    value: "http://${system.cluster.name}-private-ai-rag-juicefs-s3-gateway.nh-addons.svc.cluster.local:9000"