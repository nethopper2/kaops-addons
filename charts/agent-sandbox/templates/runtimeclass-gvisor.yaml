{{- if .Values.runtimeClasses.gvisor.enabled }}
{{- /*
gVisor RuntimeClass for workspace sandboxes — fallback tier for clusters
without KVM access. Cluster-scoped. Prerequisite: runsc installed and
registered in containerd on the target node pool.
NOTE on GKE: enable GKE Sandbox on a node pool instead — GKE creates the
"gvisor" RuntimeClass itself; leave this disabled there.
*/}}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
{{- end }}
